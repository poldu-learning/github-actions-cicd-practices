# This workflow will install Python dependencies, run tests and lint with multiple versions of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
    paths:
      - '02_04_challenge_container_workflow/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '02_04_challenge_container_workflow/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v6.0.1
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.1.0
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f 02_04_challenge_container_workflow/requirements.txt ]; then pip install -r 02_04_challenge_container_workflow/requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        flake8 02_04_challenge_container_workflow --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 02_04_challenge_container_workflow --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Test with pytest
      run: |
        pytest 02_04_challenge_container_workflow
